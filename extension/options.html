<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Playlist Guard</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#0f1728;color:#f4f7ff;padding:28px;line-height:1.55}
    .card{max-width:760px;background:#16213a;border:1px solid #30466a;border-radius:16px;padding:20px;margin-bottom:14px}
    h1,h2{margin-top:0}
    p{color:#b8c5d8}
  </style>
</head>
<body>
  <div class="card">
    <h1>Playlist Guard v0.8 Beta</h1>
    <p>Each playlist now supports its own schedule, keeps a change history, and shows its cover image when YouTube provides one.</p>
  </div>
  <div class="card">
    <h2>Themes</h2>
    <p>You can switch between Neon Night, Midnight Blue, and Light Archive directly from the popup header.</p>
  </div>
</body>
</html>
